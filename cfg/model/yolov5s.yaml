# parameters
num_classes: &num_classes 80  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple

# anchors
anchors: &anchor
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 backbone
  - input_idx: -1 # 0-P1/2
    module: Focus 
    module_args: 
      out_channel: 64
      kernel: 3
  - input_idx: -1 # 1-P2/4
    module: ConvBNAct 
    module_args: 
      out_channel: 128
      kernel: 3
      dilation: 1
      stride: 2
      bias: False
      act: torch.nn.SiLU
      bn: True
  - input_idx: -1
    module: YOLOC3 
    module_args: 
      out_channel: 128
      num_repeat: 3
  - input_idx: -1 # 3-P3/8
    module: ConvBNAct 
    module_args: 
      out_channel: 256
      kernel: 3
      dilation: 1
      stride: 2
      bias: False
      act: torch.nn.SiLU
      bn: True
  - input_idx: -1
    module: YOLOC3 
    module_args: 
      out_channel: 256
      num_repeat: 9
  - input_idx: -1 # 5-P4/16
    module: ConvBNAct 
    module_args: 
      out_channel: 512
      kernel: 3
      dilation: 1
      stride: 2
      bias: False
      act: torch.nn.SiLU
      bn: True
  - input_idx: -1
    module: YOLOC3 
    module_args: 
      out_channel: 512
      num_repeat: 9
  - input_idx: -1 # 7-P5/32
    module: ConvBNAct 
    module_args: 
      out_channel: 1024
      kernel: 3
      dilation: 1
      stride: 2
      bias: False
      act: torch.nn.SiLU
      bn: True
  - input_idx: -1
    module: SPP
    module_args: 
      out_channel: 1024
      kernels: [5, 9, 13]
  - input_idx: -1 # 9
    module: YOLOC3 
    module_args: 
      out_channel: 1024
      num_repeat: 3
      
# head
  - input_idx: -1
    module: ConvBNAct 
    module_args: 
      out_channel: 512
      kernel: 1
      dilation: 1
      stride: 1
      bias: False
      act: torch.nn.SiLU
      bn: True
  - input_idx: -1
    module: torch.nn.Upsample
    module_args:
      size: 
      scale_factor: 2
      mode: nearest
  - input_idx: [-1, 6] # cat backbone P4
    module: Concat
    module_args:
      dimension: 1
  - input_idx: -1 # 13
    module: YOLOC3 
    module_args: 
      out_channel: 512
      num_repeat: 3
      shortcut: False

  - input_idx: -1
    module: ConvBNAct 
    module_args: 
      out_channel: 256
      kernel: 3
      dilation: 1
      stride: 2
      bias: False
      act: torch.nn.SiLU
      bn: True
  - input_idx: -1
    module: torch.nn.Upsample
    module_args:
      size: 
      scale_factor: 2
      mode: nearest
  - input_idx: [-1, 4] # cat backbone P3
    module: Concat
    module_args:
      dimension: 1
  - input_idx: -1 # 17 (P3/8-small)
    module: YOLOC3 
    module_args: 
      out_channel: 256
      num_repeat: 3
      shortcut: False 

  - input_idx: -1
    module: ConvBNAct 
    module_args: 
      out_channel: 256
      kernel: 3
      dilation: 1
      stride: 2
      bias: False
      act: torch.nn.SiLU
      bn: True
  - input_idx: [-1, 14] # cat backbone P4
    module: Concat
    module_args:
      dimension: 1
  - input_idx: -1 # 20 (P4/16-medium)
    module: YOLOC3 
    module_args: 
      out_channel: 512
      num_repeat: 3
      shortcut: False 

  - input_idx: -1
    module: ConvBNAct 
    module_args: 
      out_channel: 512
      kernel: 3
      dilation: 1
      stride: 2
      bias: False
      act: torch.nn.SiLU
      bn: True
  - input_idx: [-1, 10] # cat backbone P5
    module: Concat
    module_args:
      dimension: 1
  - input_idx: -1 # 23 (P5/32-large)
    module: YOLOC3 
    module_args: 
      out_channel: 1024
      num_repeat: 3
      shortcut: False 

  - input_idx: [17, 20, 23] # Detect(P3, P4, P5)
    module: YOLODetect
    module_args: 
      num_classes: *num_classes
      anchors: *anchors

