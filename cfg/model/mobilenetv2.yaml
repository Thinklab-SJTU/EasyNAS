depth_multiple: 1.0
width_multiple: 1.0
num_classes: &num_classes 1000

name: BaseModel
module_name: .models
package_path: src
log_path: model.log

architecture:
  - input_idx: -1
    module: ConvBNAct
    module_args: 
      out_channel: 32
      kernel: 3
      dilation: 1
      stride: 2
      bias: False
      act: torch.nn.ReLU6
      bn: True
  - input_idx: -1
    module: InvertedResidual
    num_repeat: 1
    module_args:
      out_channel: 16
      kernel: 3
      stride: 1
      expand_ratio: 1
  - input_idx: -1
    module: InvertedResidual
    num_repeat: 2
    module_args:
      out_channel: 24
      kernel: 3
      stride: 2
      expand_ratio: 6
  - input_idx: -1
    module: InvertedResidual
    num_repeat: 3
    module_args:
      out_channel: 32
      kernel: 3
      stride: 2
      expand_ratio: 6
  - input_idx: -1
    module: InvertedResidual
    num_repeat: 4
    module_args:
      out_channel: 64
      kernel: 3
      stride: 2
      expand_ratio: 6
  - input_idx: -1
    module: InvertedResidual
    num_repeat: 3
    module_args:
      out_channel: 96
      kernel: 3
      stride: 1
      expand_ratio: 6
  - input_idx: -1
    module: InvertedResidual
    num_repeat: 3
    module_args:
      out_channel: 160
      kernel: 3
      stride: 2
      expand_ratio: 6
  - input_idx: -1
    module: InvertedResidual
    num_repeat: 1
    module_args:
      out_channel: 320
      kernel: 3
      stride: 1
      expand_ratio: 6
  - input_idx: -1
    module: ConvBNAct
    module_args: 
      out_channel: 1280
      kernel: 1
      dilation: 1
      stride: 1
      bias: False
      act: torch.nn.ReLU6
      bn: True
  - input_idx: -1
    module: GlobalPoolBNAct
    module_args:
      pool: avg
      bn: False
      act: False
  - input_idx: -1
    module: torch.nn.Dropout
    module_args:
      p: 0.2
  - input_idx: -1
    module: torch.nn.Linear
    is_outlayer: True
    module_args:
      in_features: 1280
      out_features: *num_classes

