depth_multiple: 1
width_multiple: 1
submodule_name: src.models.SearchModel
args:
  log_path: model.log
  depth_multiple: 1.0
  width_multiple: 1.0
  num_classes: &num_classes 10
  architecture:
# stem
    - input_idx: -1 # 0
      submodule_name: ConvBNAct
      args: 
        out_channel: 64
        kernel: 3
        dilation: 1
        stride: 1
        bias: False
        act: torch.nn.ReLU
        bn: True

# normal cell * 2
    - input_idx: [-1, -1] # 1
      submodule_name: Cell_search
      arch_idx: 
      num_repeat: 1
      args:
        out_channel: 64
        strides: [1, 1]
        gumbel_op: False
        gumbel_edge: False
    - input_idx: [-2, -1] # 2
      submodule_name: Cell_search
      arch_idx: -1
      num_repeat: 1
      args:
        out_channel: 64
        strides: [1, 1]
        gumbel_op: False
        gumbel_edge: False

# reduce cell * 1  
    - input_idx: [-2, -1] # 3
      submodule_name: Cell_search
      arch_idx: 
      num_repeat: 1
      args:
        out_channel: 128
        strides: [2, 2]
        gumbel_op: False
        gumbel_edge: False

# normal cell * 2
    - input_idx: [-2, -1] # 4
      submodule_name: Cell_search
      arch_idx: 1
      num_repeat: 1
      args:
        out_channel: 128
        strides: [2, 1]
        gumbel_op: False
        gumbel_edge: False
    - input_idx: [-2, -1] # 5
      submodule_name: Cell_search
      arch_idx: -1
      num_repeat: 1
      args:
        out_channel: 128
        strides: [1, 1]
        gumbel_op: False
        gumbel_edge: False

# reduce cell * 1  
    - input_idx: [-2, -1] # 6
      submodule_name: Cell_search
      arch_idx: 3
      num_repeat: 1
      args:
        out_channel: 256
        strides: [2, 2]
        gumbel_op: False
        gumbel_edge: False

# normal cell * 2
    - input_idx: [-2, -1] # 7
      submodule_name: Cell_search
      arch_idx: 1
      num_repeat: 1
      args:
        out_channel: 256
        strides: [2, 1]
        gumbel_op: False
        gumbel_edge: False
    - input_idx: [-2, -1] # 8
      submodule_name: Cell_search
      arch_idx: -1
      num_repeat: 1
      args:
        out_channel: 256
        strides: [1, 1]
        gumbel_op: False
        gumbel_edge: False

    - input_idx: -1
      submodule_name: GlobalPoolBNAct
      args:
        pool: avg
        bn: False
        act: False
    - input_idx: -1
      submodule_name: torch.nn.Linear
      is_outlayer: True
      args:
        in_features: 256
        out_features: *num_classes

