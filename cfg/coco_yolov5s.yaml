root_path: &root_path runs/coco_yolov5s/
epoch: &epoch 300
accumulate_gradient: &acc_grad 1

train_hyp: &hyp
  lr0: &lr0 0.01  # initial learning rate (SGD=1E-2, Adam=1E-3)
  lrf: &lrf 0.2  # final OneCycleLR learning rate (lr0 * lrf)
  momentum: &momentum 0.937  # SGD momentum/Adam beta1
  weight_decay: &wd 0.0005  # optimizer weight decay 5e-4
  warmup_epochs: 3.0  # warmup epochs (fractions ok)
  warmup_init_momentum_rate: &warmup_init_momentum_rate 0.854  # warmup initial momentum
  warmup_bias_lr: &warmup_bias_lr 0.1  # warmup initial bias lr



optimizer: &optimizer
  submodule_name: torch.optim.SGD
  args:
    params: [{'params': conv_parameters, 'weight_decay': *wd}, {'params': bias_parameters}, {'params': all_parameters}]
    lr: *lr0
    momentum: *momentum

lr_scheduler: &scheduler
  submodule_name: torch.optim.lr_scheduler.LambdaLR
  args:
    optimizer: 
    lr_lambda: !get_module [src.scheduler.one_cycle, {'start': 1, 'end': *lrf, 'steps': *epoch}]


hooks: &hooks
  opt_hook:
    submodule_name: OptHOOK
    args:
      priority: 0
      accumulate_gradient: *acc_grad
  
  lr_scheduler_hook:
    submodule_name: LrScheduleHOOK
    args: 
      priority: 5
      mode: epoch
  
  #TODO
  eval_hook:
    submodule_name: EvalCOCOmAPHOOK
    args: 
      anno_file: 'data/coco/annotations/instances_val2017.json'
      iou_thres: 0.7
      conf_thres: 0.001
      eval_by_cocotools: True
      priority: 10
  
  ddp_hook:
    submodule_name: DDPHOOK
    args:
      priority: 10
  
  
  log_hook:
    submodule_name: LogHOOK
    args:
      logger_name: TrainPip
      log_path: !join [*root_path, test.log]
      print_freq: 100
      only_master: True
      priority: 20
  
  ckpt_hook:
    submodule_name: CkptHOOK
    args:
      save_root: !join [*root_path, ckpt/]
      pretrain: 
      only_master: True
      priority: 20
  
  warmup_hook:
    submodule_name: WarmupHOOK
    args:
      max_iter: 1000
      warmup_init_lr_rate: [1., *warmup_bias_lr, 1.]
      warmup_init_momentum_rate: *warmup_init_momentum_rate
      priority: 0
      accumulate_gradient: *acc_grad
  
  ema_hook:
    submodule_name: EMAHOOK
    args:
      decay: 0.999
      priority: 5
      accumulate_gradient: *acc_grad


engine:
  submodule_name: engines.NNEngine
  args:
    data: !cross_ref [cfg/dataset/coco_yolo.yaml]
    criterion: !cross_ref [cfg/criterion/yolov5.yaml]
    model: !cross_ref [cfg/model/yolov5s.yaml]
    optimizer: *optimizer
    lr_scheduler: *scheduler
    hooks: *hooks
    amp: True

